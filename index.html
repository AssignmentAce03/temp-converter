<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 100px;
            margin-top: 10px;
        }
        .output {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Celsius to Fahrenheit</h2>
        <label for="celsius">Enter °C:</label><br>
        <input type="number" id="celsius" placeholder="0" oninput="convert()">
        
        <div class="output">
            Result: <span id="fahrenheit">32</span> °F
        </div>
    </div>

    <script>
        function convert() {
            // 1. Get the number from the input
            let c = document.getElementById('celsius').value;
            
            // 2. Handle empty input
            if (c === "") {
                document.getElementById('fahrenheit').innerText = "--";
                return;
            }

            // 3. Apply the formula: (C * 1.8) + 32
            let f = (parseFloat(c) * 1.8) + 32;

            // 4. Output the result rounded to 1 decimal place
            document.getElementById('fahrenheit').innerText = f.toFixed(1);
        }
    </script>

</body>
</html>
